<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Pixelle</title>
  <link data-trunk rel="copy-file" href="../../assets/app-icon/pixelle.svg">
  <link rel="icon" type="image/svg+xml" href="pixelle.svg">
  <link data-trunk rel="rust" href="Cargo.toml" data-bin="photocraft-ml-worker" data-type="worker" data-loader-shim data-cargo-features="ml-worker" data-cargo-profile="wasm-release" data-wasm-opt="z" />
  <link data-trunk rel="rust" data-bin="photocraft-web" data-cargo-profile="wasm-release" data-cargo-features="heif" data-wasm-opt="z" data-weak-refs />
  <script>
    const pixelleQuickTool = /\/(quick-tools|remove-background|blur-background|extract-object|remove-object|auto-enhance|denoise|sharpen|resize-image|expand-canvas|replace-background|relight|restyle|generative-fill)\.html$/.test(location.pathname);
    if (pixelleQuickTool) {
      document.documentElement.classList.add('pixelle-quick-tool');
      document.documentElement.lang = 'ru';
      addEventListener('DOMContentLoaded', () => {
        document.querySelector('#photocraft_loading > p:first-child').textContent = 'Загружаем Pixelle…';
        document.getElementById('photocraft_stalled').innerHTML = 'Загрузка занимает больше времени, чем обычно. <a href="">Перезагрузите страницу</a>, чтобы попробовать ещё раз.';
      });
    }
  </script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #262626; }
    #photocraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #photocraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 0 16px; text-align: center; color: #b8b8b8; font: 14px system-ui, sans-serif; pointer-events: none; }
    #photocraft_loading p { margin: 0 0 8px; max-width: 420px; line-height: 1.5; }
    #photocraft_loading a { color: #e0e0e0; pointer-events: auto; }
    /* The app removes this element once it runs. If the WebAssembly never downloads or doesn't match
       this page, no Rust runs to say so, so the page itself shows what to do after a while. */
    #photocraft_stalled { color: #8c8c8c; visibility: hidden; animation: photocraft-stalled 0s 20s forwards; }
    @keyframes photocraft-stalled { to { visibility: visible; } }
    html.pixelle-quick-tool, html.pixelle-quick-tool body { background: #f3f1ea; }
    html.pixelle-quick-tool #photocraft_loading { color: #65675f; }
    html.pixelle-quick-tool #photocraft_stalled { color: #85877f; }
    html.pixelle-quick-tool #photocraft_loading a { color: #171914; }
  </style>
</head>
<body>
  <canvas id="photocraft_canvas"></canvas>
  <div id="photocraft_loading">
    <p>Loading Pixelle&hellip;</p>
    <p id="photocraft_stalled">This is taking longer than usual. If Pixelle doesn't start, its files may have failed to
      download or come from a different version of this page. <a href="">Reload</a> to try again; the browser
      console lists what failed.</p>
  </div>
</body>
</html>
